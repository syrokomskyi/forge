forgePlugin: true
# extract.config.yaml — repo-extract standalone package export for @warpgogol/forge
# Extracts packages/forge from the werkstatt monorepo into a standalone public repo.

projectDir: packages/forge
destName: forge
standalone: true
# versionBump omitted — version in package.json is the target version

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/forge"
stubPackages:
  # NOTE: stubPackages is not implemented in @warpgogol/repo-extract (<=1.3.0)
  # — it is dead config. Stubbing is done via the postProcess copy rule below,
  # which injects extract-stubs/werkstatt-shared.d.ts (ambient module decls)
  # so type-only imports compile without the real package (ADR-0019).
  - "@warpgogol/werkstatt-engine"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - lifecycle-handlers.test.ts

postProcess:
  - action: copy
    from: packages/forge/extract-stubs/werkstatt-shared.d.ts
    to: src/werkstatt-shared-stubs.d.ts
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/forge.git
  autoPush: true
