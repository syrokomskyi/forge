forgePlugin: true
# extract.config.yaml — repo-extract standalone package export for @warpgogol/forge
# Extracts packages/forge from the werkstatt monorepo into a standalone public repo.

projectDir: packages/forge
destName: forge
standalone: true
# versionBump omitted — version in package.json is the target version

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/forge"
# NOTE: stubPackages is silently ignored in standalone mode
# (@warpgogol/repo-extract <=1.3.0 also ignored postProcess; >=1.4 runs it —
# the AGENTS.standalone.md copy below relies on that). The effective
# levers are ignoreDirs/excludePathSegments/preservePackages. Forge types
# needed from werkstatt-shared are inlined in src/types.ts (ADR-0019); only
# dynamic imports in os/werkstatt/handlers/workspace-deps.ts remain, guarded
# by @ts-ignore.
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - .coverage
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - lifecycle-handlers.test.ts
  # Monorepo-bound tests — they exercise workspace deps (@warpgogol/werkstatt-shared,
  # werkstatt-engine) or monorepo-root artifacts (module-map.ts, generated command
  # manifest, .agents mirror) that do not exist inside the standalone repo. They
  # stay full-strength in the monorepo suite; shipping them would only produce
  # guaranteed failures there. Discovered during the 9.0.0 export.
  - ship-inflight.test.ts
  - ac8-ac9-registry-reachability.acceptance.test.ts
  - ac10-operating-model-policy.acceptance.test.ts
  # They read the werkstatt tree itself (packages/, docs/rfcs): the real
  # release-line set, the RFC corpus, monorepo probe paths. Operator-approved
  # 2026-11-03 after the forge@9.2.0 extract-verify failure.
  - release-lines.test.ts
  - probe-batch.test.ts
  - validate-corpus.test.ts
  # monorepo-bound: they resolve the werkstatt root four levels up and read
  # docs/command-manifest.generated.yaml — outside the package root (RFC-1517)
  - src/tests/skill-agents-sync.test.ts
  - src/tests/rfc-evidence-sync.test.ts
  - src/tests/pkg-health-self-scan.test.ts
  # monorepo-scoped agent guide — not meaningful inside the standalone repo
  - AGENTS.md

# The frontmatter fixture inside this test carries an intentional root-escape
# literal as DATA (never resolved) — the offending line sits inside a template
# literal so a same-line comment would corrupt the fixture.
pkgHealth10Suppressions:
  - src/tests/knowledge-conflicts-resolve.test.ts

# Dest-side shield (RFC-1252): commitExport stages `git add -A`, so untracked
# files dropped into the standalone repo between exports (agent skill installs,
# forge-create scaffolds) would be swept into the public repo. The generated
# .gitignore is rewritten on every export — list the known foreign paths here
# so they stay ignored. `.agents/` must remain on disk (local skill resolver
# reads it) but never enters git.
extraGitignore:
  - .agents/
  - forge.yaml
  - PREFERENCES.md
  - docs/adrs/
  - docs/plans/
  - docs/rfcs/

# Ships a standalone-scoped agent guide; the monorepo AGENTS.md stays excluded
# via excludePathSegments above.
postProcess:
  - action: copy
    from: packages/forge/AGENTS.standalone.md
    to: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/forge.git
  autoPush: true
  # RFC-1252 / repo-extract >=1.4.0: a non-fast-forward push (diverged remote
  # history after history transfer) reconciles itself via fetch +
  # merge -s ours + one push retry. Local tree stays the authoritative export;
  # remote history is preserved. Never force-pushes.
  autoReconcile: true
