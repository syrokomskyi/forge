forgePlugin: true
# extract.config.yaml — repo-extract standalone package export for @warpgogol/forge
# Extracts packages/forge from the werkstatt monorepo into a standalone public repo.

projectDir: packages/forge
destName: forge
standalone: true
# versionBump omitted — version in package.json is the target version

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/forge"
# NOTE: stubPackages and postProcess are silently ignored in standalone mode
# (@warpgogol/repo-extract <=1.3.0) — do not re-add them here; the effective
# levers are ignoreDirs/excludePathSegments/preservePackages. Forge types
# needed from werkstatt-shared are inlined in src/types.ts (ADR-0019); only
# dynamic imports in os/werkstatt/handlers/workspace-deps.ts remain, guarded
# by @ts-ignore.
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - .coverage
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - lifecycle-handlers.test.ts
  # monorepo-scoped agent guide — not meaningful inside the standalone repo
  - AGENTS.md

git:
  remote: git@github.com:syrokomskyi/forge.git
  autoPush: true
  # RFC-1252 / repo-extract >=1.4.0: a non-fast-forward push (diverged remote
  # history after history transfer) reconciles itself via fetch +
  # merge -s ours + one push retry. Local tree stays the authoritative export;
  # remote history is preserved. Never force-pushes.
  autoReconcile: true
