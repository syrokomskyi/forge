forgePlugin: true
# extract.config.yaml — repo-extract standalone package export for @warpgogol/forge
# Extracts packages/forge from the werkstatt monorepo into a standalone public repo.

projectDir: packages/forge
destName: forge
standalone: true
# versionBump omitted — version in package.json is the target version

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/forge"
# NOTE: stubPackages and postProcess are NOT executed in standalone mode by
# @warpgogol/repo-extract (<=1.3.0) — both are dead config here. Type-only
# @warpgogol/werkstatt-shared imports are handled by @ts-ignore comments at
# the import sites instead (see workspace-deps.ts convention, ADR-0019).
stubPackages:
  - "@warpgogol/werkstatt-engine"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - lifecycle-handlers.test.ts

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/forge.git
  autoPush: true
