# Shared name table for the fixed branch model (RFC-1486).
# Columns:
#   name     — branch short name tested
#   verdict  — allow | refuse (what classifyBranch and the shell guard must do)
#   rule     — FLOW-GUARD-01 | FLOW-GUARD-02 | null (expected refusal id)
#   ref_ok   — false when git itself cannot create the name as a ref; parity
#              test skips these rows and asserts they are all refuse verdicts.
# Both AC-1 (parseFlowBranch) and AC-5 (shell/TypeScript parity) read this
# table — add rows, never fork it.
rows:
