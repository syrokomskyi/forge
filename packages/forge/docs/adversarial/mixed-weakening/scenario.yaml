schema: forge/adversarial-scenario@1
name: mixed-weakening
requires:
  - RFC-1580
  - RFC-1615
setup:
  - contour:
      extraFiles:
        hooks/integration-gate.sh: |
          #!/bin/sh
          exit 0
        .forge/pinned.yaml: |
          pinned: []
attack:
  files:
    hooks/integration-gate.sh: |
      #!/bin/sh
      echo gate skipped
      exit 0
    src/feature.ts: |
      export const feature = true;
  commitMessage: ship a feature and a frozen-file weakening in one session
invoke: correctness.gate --base {base} --json
expect:
  status: refused
  rule: CORR-GATE-02
