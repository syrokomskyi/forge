schema: forge/adversarial-scenario@1
name: weaken-oracle
requires:
  - RFC-1580
  - RFC-1615
setup:
  - contour:
      extraFiles:
        hooks/integration-gate.sh: |
          #!/bin/sh
          exit 0
        .forge/pinned.yaml: |
          pinned: []
attack:
  files:
    test/dispatch.oracle.ts: |
      console.log("weakened — always passes");
  commitMessage: weaken the frozen oracle
invoke: correctness.gate --base {base} --json
expect:
  status: refused
  rule: CORR-GATE-02
