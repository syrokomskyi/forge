schema: forge/config@1
project:
  name: forge
  consumer: forge
  stack:
    - typescript
    - pnpm-monorepo
  packageManager: pnpm
paths:
  rfcsDir: docs/rfcs
  adrsDir: docs/adrs
  plansDir: docs/plans
  auditsDir: docs/audits
  specsDir: docs/specs
  skillsDir: .agents/skills
  sessionsDir: docs/sessions
forge:
  syncedVersion: 10.1.0
policy:
  mutable:
    - project
    - forge
    - moves
  additive:
    - bindings
    - paths
    - loopMetrics
  freezeFiles:
    - hooks/**
    - .github/workflows/**
    - .github/CODEOWNERS
    - .forge/pinned.yaml
