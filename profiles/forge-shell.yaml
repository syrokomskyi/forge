schema: forge/stack-profile@1
id: forge-shell
displayName: Forge Shell (minimal)
detect:
  anyOf:
    - forge-shell.marker
workspace:
  dirs:
    - docs
    - scripts
  files:
    - path: .gitignore
      content: |
        node_modules
        dist
        .turbo
        .cache
        operator-profile.md
    - path: .github/workflows/ci.yml
      content: |
        name: CI

        on:
          pull_request:
          push:
            branches: [main]
          workflow_dispatch:

        jobs:
          ci:
            runs-on: ubuntu-latest
            name: Lint, type-check, test

            steps:
              - name: Checkout
                uses: actions/checkout@v5

              - name: Enable Corepack
                run: corepack enable

              - name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                  node-version: "24"
                  cache: "pnpm"

              - name: Install dependencies
                run: pnpm install --frozen-lockfile

              - name: Format check
                run: pnpm format:check

              - name: Test
                run: pnpm test

        # Windows CI (optional — uncomment if Windows checks are needed):
        #
        #   windows-ci:
        #     runs-on: windows-latest
        #     name: Lint, type-check, test (Windows)
        #     env:
        #       GIT_CONFIG_COUNT: 1
        #       GIT_CONFIG_KEY_0: core.longpaths
        #       GIT_CONFIG_VALUE_0: "true"
        #     steps:
        #       - name: Checkout
        #         uses: actions/checkout@v5
        #       - name: Enable Corepack
        #         run: corepack enable
        #       - name: Setup Node.js
        #         uses: actions/setup-node@v5
        #         with:
        #           node-version: "24"
        #           cache: "pnpm"
        #       - name: Install dependencies
        #         run: pnpm install --frozen-lockfile
        #       - name: Format check
        #         run: pnpm format:check
        #       - name: Test
        #         run: pnpm test
        #
        # The GIT_CONFIG_COUNT env block MUST be set before the checkout step
        # so git can handle long file paths during clone on Windows.
        # Do not add Windows to the matrix "just in case" — it requires
        # separate path-length and platform-specific dependency verification.
    - path: package.json
      content: |
        {
          "name": "__PROJECT_NAME__",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "engines": {
            "node": ">=22"
          },
          "scripts": {
            "clean": "node scripts/clean.mjs",
            "format": "prettier --write .",
            "format:check": "prettier --check .",
            "test": "vitest run --passWithNoTests",
            "upgrade-packages": "pnpm up"
          }
        }
    - path: scripts/clean.mjs
      content: |
        import { readdir, rm } from "node:fs/promises";
        import { join } from "node:path";
        import { fileURLToPath } from "node:url";

        const TARGETS = new Set(["node_modules", ".turbo", "dist", ".astro", ".cache", ".wrangler"]);

        const repoRoot = join(fileURLToPath(import.meta.url), "..", "..");

        async function walk(dir, toDelete) {
          const entries = await readdir(dir, { withFileTypes: true });
          for (const entry of entries) {
            if (!entry.isDirectory()) continue;
            const name = entry.name;
            const fullPath = join(dir, name);
            if (TARGETS.has(name)) {
              toDelete.push(fullPath);
              continue;
            }
            await walk(fullPath, toDelete);
          }
        }

        const toDelete = [];
        await walk(repoRoot, toDelete);

        if (toDelete.length === 0) {
          console.log("Nothing to clean.");
          process.exit(0);
        }

        await Promise.all(toDelete.map((p) => rm(p, { recursive: true, force: true })));

        for (const p of toDelete) {
          console.log("deleted", p.replace(repoRoot + "/", ""));
        }

        console.log(`Cleaned ${toDelete.length} directories.`);
install:
  - pnpm add -D @warpgogol/forge prettier vitest
