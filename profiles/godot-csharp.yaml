schema: forge/stack-profile@1
id: godot-csharp
displayName: Godot 4.x + C#
detect:
  anyOf:
    - project.godot
domain: game
register: creative
terminology:
  artifact: game
  artifactPlural: games
  module: scene
  source: scene/script file
  output: build
  verify: headless-check
  operator: game-developer
devServer:
  command: godot --path . --editor
  port: 6005
artifacts:
  - id: game
    extensions:
      - .tscn
      - .cs
      - .tres
    produce:
      command: dotnet build
      output: bin/Debug
    validate:
      command: godot --path . --headless --quit
    determinism:
      hashable: true
      inputs:
        - Scenes/**/*.tscn
        - Scripts/**/*.cs
        - Resources/**/*.tres
        - project.godot
assets:
  dir: Assets
  types:
    - id: image
      extensions: [.png, .jpg, .jpeg, .webp, .svg, .tscn]
      referencePattern: '"([^"]+\.(?:png|jpe?g|webp|svg))"'
    - id: audio
      extensions: [.wav, .mp3, .ogg]
      referencePattern: '"([^"]+\.(?:wav|mp3|ogg))"'
    - id: font
      extensions: [.ttf, .otf, .woff, .woff2]
      referencePattern: '"([^"]+\.(?:ttf|otf|woff2?))"'
release:
  target: local
  outputDir: build
  manifestName: build-manifest.json
prerequisites:
  - id: nodejs
    name: Node.js 24+
    check: node --version
    installHint: "https://nodejs.org/en/download/"
    severity: error
  - id: dotnet
    name: .NET SDK 8+
    check: dotnet --version
    installHint: "https://dotnet.microsoft.com/download"
    severity: error
  - id: godot
    name: Godot 4.x (with .NET support)
    check: godot --version
    installHint: "https://godotengine.org/download"
    severity: error
workspaceTypes:
  - id: game
    detect:
      glob: "project.godot"
    skills:
      - godot-feature
      - godot-scene-review
      - godot-debug
invariants:
  - id: GODOT-01
    rule: Scene files (.tscn) must reside in Scenes/ and scripts (.cs) in Scripts/
    severity: error
    check:
      kind: filename-pattern
      glob: "**/*.tscn"
      pattern: "^Scenes/"
  - id: GODOT-02
    rule: The .godot/ directory must not be committed to git
    severity: error
    check:
      kind: gitignore-entry
      pattern: ".godot/"
  - id: GODOT-03
    rule: No hardcoded API keys or secrets in C# source files
    severity: error
    check:
      kind: secret-scan
      glob: "**/*.cs"
  - id: GODOT-04
    rule: project.godot autoloads and input map changes require explicit confirmation
    severity: warning
    check:
      kind: file-contains
      glob: "project.godot"
      pattern: ""
workspace:
  dirs:
    - apps
    - packages
    - services
    - scripts
    - tools
    - missions
    - systems-cache
  files:
    - path: pnpm-workspace.yaml
      content: |
        packages:
          - "apps/*"
          - "packages/*"
          - "services/*"
    - path: turbo.json
      content: |
        {
          "$schema": "https://turbo.build/schema.json",
          "tasks": {
            "build": {
              "dependsOn": ["^build"],
              "outputs": ["dist/**", "bin/**", ".godot/**"]
            },
            "build:check": {
              "dependsOn": ["^build:check"]
            },
            "test": {
              "dependsOn": ["^build:check"]
            }
          }
        }
    - path: tsconfig.base.json
      content: |
        {
          "compilerOptions": {
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "strict": true,
            "esModuleInterop": true,
            "skipLibCheck": true,
            "forceConsistentCasingInFileNames": true
          }
        }
    - path: .gitignore
      content: |
        node_modules
        dist
        .turbo
        .cache
        operator-profile.md

        # Godot
        .godot/
        .godot-bin/
        bin/
        obj/
        *.user
        *.csproj.user
    - path: .vscode/extensions.json
      content: |
        {
          "recommendations": [
            "ms-dotnettools.csharp",
            "muhammad-sammy.csharp",
            "geequla.godot-tools",
            "github.vscode-github-actions",
            "esbenp.prettier-vscode",
            "mechatroner.rainbow-csv"
          ]
        }
    - path: .vscode/tasks.json
      content: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "build",
              "command": "dotnet",
              "type": "process",
              "args": ["build", "${workspaceFolder}/apps/__PROJECT_NAME__/Game.csproj"],
              "problemMatcher": "$mscompile",
              "group": { "kind": "build", "isDefault": true }
            }
          ]
        }
    - path: .vscode/launch.json
      content: |
        {
          "version": "0.2.0",
          "configurations": [
            {
              "name": "Play (Node)",
              "type": "node",
              "request": "launch",
              "preLaunchTask": "build",
              "runtimeExecutable": "node",
              "runtimeArgs": ["${workspaceFolder}/scripts/run-godot.mjs"],
              "cwd": "${workspaceFolder}",
              "console": "integratedTerminal"
            },
            {
              "name": "Play (C# Dev Kit)",
              "type": "coreclr",
              "request": "launch",
              "preLaunchTask": "build",
              "program": "${workspaceFolder}/.godot-bin/godot",
              "args": ["--path", "${workspaceFolder}/apps/__PROJECT_NAME__"],
              "cwd": "${workspaceFolder}",
              "console": "internalConsole",
              "stopAtEntry": false
            },
            {
              "name": "Play (C# Dev Kit, PATH Godot)",
              "type": "coreclr",
              "request": "launch",
              "preLaunchTask": "build",
              "program": "godot",
              "args": ["--path", "${workspaceFolder}/apps/__PROJECT_NAME__"],
              "cwd": "${workspaceFolder}",
              "console": "internalConsole",
              "stopAtEntry": false
            }
          ]
        }
    - path: .github/workflows/ci.yml
      content: |
        name: CI

        on:
          pull_request:
          push:
            branches: [main]
          workflow_dispatch:

        concurrency:
          group: ${{ github.workflow }}-${{ github.ref }}
          cancel-in-progress: ${{ github.event_name == 'pull_request' }}

        permissions:
          contents: read

        jobs:
          ci:
            runs-on: ubuntu-latest
            timeout-minutes: 20
            name: Build, test, headless check
            env:
              TZ: UTC

            steps:
              - name: Checkout
                uses: actions/checkout@v5

              - name: Enable Corepack
                run: corepack enable

              - name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                  node-version: "24"
                  cache: "pnpm"

              - name: Setup .NET SDK
                uses: actions/setup-dotnet@v4
                with:
                  dotnet-version: "8.0.x"

              - name: Setup Godot
                uses: lihop/setup-godot@v1
                with:
                  version: "4.3"
                  mono: true

              - name: Install dependencies
                run: pnpm install --frozen-lockfile

              - name: Format check
                run: pnpm format:check

              - name: Type check
                run: pnpm build:check

              - name: Build
                run: pnpm build

              - name: Test
                run: pnpm test

        # Windows CI (optional — uncomment if Windows checks are needed):
        #
        #   windows-ci:
        #     runs-on: windows-latest
        #     name: Build, test, headless check (Windows)
        #     env:
        #       GIT_CONFIG_COUNT: 1
        #       GIT_CONFIG_KEY_0: core.longpaths
        #       GIT_CONFIG_VALUE_0: "true"
        #     steps:
        #       - name: Checkout
        #         uses: actions/checkout@v5
        #       - name: Enable Corepack
        #         run: corepack enable
        #       - name: Setup Node.js
        #         uses: actions/setup-node@v5
        #         with:
        #           node-version: "24"
        #           cache: "pnpm"
        #       - name: Setup .NET SDK
        #         uses: actions/setup-dotnet@v4
        #         with:
        #           dotnet-version: "8.0.x"
        #       - name: Setup Godot
        #         uses: lihop/setup-godot@v1
        #         with:
        #           version: "4.3"
        #           mono: true
        #       - name: Install dependencies
        #         run: pnpm install --frozen-lockfile
        #       - name: Format check
        #         run: pnpm format:check
        #       - name: Type check
        #         run: pnpm build:check
        #       - name: Build
        #         run: pnpm build
        #       - name: Test
        #         run: pnpm test
        #
        # The GIT_CONFIG_COUNT env block MUST be set before the checkout step
        # so git can handle long file paths during clone on Windows.
        # Do not add Windows to the matrix "just in case" — it requires
        # separate path-length and platform-specific dependency verification.
    - path: package.json
      content: |
        {
          "name": "__PROJECT_NAME__",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "engines": {
            "node": ">=24 <25"
          },
          "scripts": {
            "clean": "node scripts/clean.mjs",
            "format": "prettier --write .",
            "format:check": "prettier --check .",
            "build": "turbo run build",
            "build:check": "turbo run build:check",
            "test": "turbo run test",
            "upgrade-packages": "pnpm -r up"
          },
          "devDependencies": {
            "typescript": "^5.7.0",
            "turbo": "^2.3.0",
            "prettier": "^3.4.0",
            "@warpgogol/forge": "^2.2.0",
            "@warpgogol/werkstatt": "^1.2.0",
            "@warpgogol/werkstatt-godot": "^0.6.0"
          }
        }
    - path: godot.version
      content: |
        # Exact Godot version for install-godot.sh (CI uses short form "4.3")
        4.3.0
    - path: scripts/install-godot.sh
      content: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Download and install the Godot mono build specified in godot.version
        # Usage: ./scripts/install-godot.sh [--force]

        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        PROJECT_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"
        VERSION="$(grep -v '^#' "$PROJECT_ROOT/godot.version" | tr -d '[:space:]')"
        GODOT_DIR="$PROJECT_ROOT/.godot-bin"
        GODOT_BIN="$GODOT_DIR/godot"

        if [[ -x "$GODOT_BIN" ]] && [[ "$1" != "--force" ]]; then
          echo "Godot $VERSION already installed at $GODOT_BIN"
          echo "Use --force to reinstall."
          exit 0
        fi

        OS="$(uname -s)"
        ARCH="$(uname -m)"

        case "$OS" in
          Linux*)  PLATFORM="linux" ;;
          Darwin*) PLATFORM="osx"   ;;
          MINGW*|MSYS*|CYGWIN*) PLATFORM="win" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac

        case "$ARCH" in
          x86_64|amd64) ARCH_SUFFIX="x86_64" ;;
          arm64|aarch64) ARCH_SUFFIX="arm64" ;;
          *) echo "Unsupported arch: $ARCH"; exit 1 ;;
        esac

        if [[ "$PLATFORM" == "osx" && "$ARCH_SUFFIX" == "x86_64" ]]; then
          ARCH_SUFFIX="universal"
        fi

        if [[ "$PLATFORM" == "win" ]]; then
          ZIP_NAME="Godot_v${VERSION}_mono_win64.zip"
        elif [[ "$PLATFORM" == "osx" ]]; then
          ZIP_NAME="Godot_v${VERSION}_mono_${PLATFORM}_${ARCH_SUFFIX}.zip"
        else
          ZIP_NAME="Godot_v${VERSION}_mono_${PLATFORM}_${ARCH_SUFFIX}.zip"
        fi

        URL="https://github.com/godotengine/godot/releases/download/v${VERSION}-stable/${ZIP_NAME}"

        echo "Downloading Godot $VERSION (mono) from:"
        echo "  $URL"

        mkdir -p "$GODOT_DIR"
        TMP_ZIP="$GODOT_DIR/$ZIP_NAME"

        if command -v curl &>/dev/null; then
          curl -fL --progress-bar -o "$TMP_ZIP" "$URL"
        elif command -v wget &>/dev/null; then
          wget -q --show-progress -O "$TMP_ZIP" "$URL"
        else
          echo "curl or wget required — please install one"; exit 1
        fi

        echo "Extracting..."
        if command -v unzip &>/dev/null; then
          unzip -o "$TMP_ZIP" -d "$GODOT_DIR"
        else
          echo "unzip not found — please install unzip"; exit 1
        fi
        rm -f "$TMP_ZIP"

        # Find the godot binary in the extracted files
        if [[ "$PLATFORM" == "osx" ]]; then
          # macOS: .app bundle
          APP_DIR="$GODOT_DIR/Godot.app"
          if [[ -d "$APP_DIR" ]]; then
            ln -sf "$APP_DIR/Contents/MacOS/Godot" "$GODOT_BIN"
          else
            # Some versions ship a unix executable
            find "$GODOT_DIR" -type f -name "Godot*" -executable | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
          fi
        elif [[ "$PLATFORM" == "win" ]]; then
          find "$GODOT_DIR" -type f -name "Godot*.exe" | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
        else
          find "$GODOT_DIR" -type f -name "Godot*" -executable | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
        fi

        chmod +x "$GODOT_BIN" 2>/dev/null || true

        if [[ -x "$GODOT_BIN" || -L "$GODOT_BIN" ]]; then
          echo ""
          echo "Godot $VERSION installed to $GODOT_BIN"
          echo "Add to PATH: export PATH=\"$GODOT_DIR:$PATH\""
        else
          echo "Installation completed but binary not found. Check $GODOT_DIR"
          exit 1
        fi
    - path: scripts/run-godot.mjs
      content: |
        #!/usr/bin/env node
        // Launch Godot from any IDE — works in Windsurf, Cursor, VS Code without extensions.
        // Usage: node scripts/run-godot.mjs [--editor]

        import { existsSync, readdirSync, statSync } from "node:fs";
        import { join, dirname, resolve } from "node:path";
        import { spawnSync } from "node:child_process";
        import { fileURLToPath } from "node:url";

        const projectRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..");
        const args = process.argv.slice(2);
        const editor = args.includes("--editor");

        // Find the game workspace (first directory under apps/ with a project.godot)
        let gameDir = null;
        const appsDir = join(projectRoot, "apps");
        if (existsSync(appsDir)) {
          for (const entry of readdirSync(appsDir)) {
            const dir = join(appsDir, entry);
            if (statSync(dir).isDirectory() && existsSync(join(dir, "project.godot"))) {
              gameDir = dir;
              break;
            }
          }
        }
        if (!gameDir) {
          console.error("No Godot project found under apps/*/");
          process.exit(1);
        }
        console.log(`Game project: ${gameDir}`);

        // Build C# project
        console.log("Building C# project...");
        const buildResult = spawnSync("dotnet", ["build"], { cwd: gameDir, stdio: "inherit" });
        if (buildResult.status !== 0) {
          console.error("dotnet build failed");
          process.exit(buildResult.status ?? 1);
        }

        // Find godot binary: prefer .godot-bin, then PATH
        const localGodot = join(projectRoot, ".godot-bin", "godot");
        const godotBin = existsSync(localGodot) ? localGodot : "godot";
        if (godotBin === "godot" && spawnSync("godot", ["--version"], { stdio: "ignore" }).status !== 0) {
          console.error("Godot not found. Run ./scripts/install-godot.sh first.");
          process.exit(1);
        }

        // Launch Godot
        console.log("Launching Godot...");
        const godotArgs = ["--path", gameDir];
        if (editor) godotArgs.push("--editor");
        const result = spawnSync(godotBin, godotArgs, { stdio: "inherit" });
        process.exit(result.status ?? 1);
    - path: scripts/run.sh
      content: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Build the C# project and launch Godot with the correct --path
        # Usage: ./scripts/run.sh [--editor]

        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        PROJECT_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"

        # Find the game workspace (first directory under apps/ with a project.godot)
        GAME_DIR=""
        for dir in "$PROJECT_ROOT"/apps/*/; do
          if [[ -f "${dir}project.godot" ]]; then
            GAME_DIR="${dir%/}"
            break
          fi
        done

        if [[ -z "$GAME_DIR" ]]; then
          echo "No Godot project found under apps/*/"; exit 1
        fi

        echo "Game project: $GAME_DIR"

        # Kill any running Godot instances (best-effort)
        pkill -f "godot.*--path" 2>/dev/null || true

        # Build C# project
        echo "Building C# project..."
        (cd "$GAME_DIR" && dotnet build)

        # Find godot binary: prefer .godot-bin, then PATH
        GODOT_BIN=""
        if [[ -x "$PROJECT_ROOT/.godot-bin/godot" ]]; then
          GODOT_BIN="$PROJECT_ROOT/.godot-bin/godot"
        elif command -v godot &>/dev/null; then
          GODOT_BIN="godot"
        else
          echo "Godot not found. Run ./scripts/install-godot.sh first."; exit 1
        fi

        echo "Launching Godot..."
        if [[ "$1" == "--editor" ]]; then
          exec "$GODOT_BIN" --path "$GAME_DIR" --editor
        else
          exec "$GODOT_BIN" --path "$GAME_DIR"
        fi
    - path: scripts/clean.mjs
      content: |
        import { readdir, rm } from "node:fs/promises";
        import { join } from "node:path";
        import { fileURLToPath } from "node:url";

        const TARGETS = new Set(["node_modules", ".turbo", "dist", ".godot", "bin", "obj", ".cache", ".wrangler"]);

        const repoRoot = join(fileURLToPath(import.meta.url), "..", "..");

        async function walk(dir, toDelete) {
          const entries = await readdir(dir, { withFileTypes: true });
          for (const entry of entries) {
            if (!entry.isDirectory()) continue;
            const name = entry.name;
            const fullPath = join(dir, name);
            if (TARGETS.has(name)) {
              toDelete.push(fullPath);
              continue;
            }
            await walk(fullPath, toDelete);
          }
        }

        const toDelete = [];
        await walk(repoRoot, toDelete);

        if (toDelete.length === 0) {
          console.log("Nothing to clean.");
          process.exit(0);
        }

        await Promise.all(toDelete.map((p) => rm(p, { recursive: true, force: true })));

        for (const p of toDelete) {
          console.log("deleted", p.replace(repoRoot + "/", ""));
        }

        console.log(`Cleaned ${toDelete.length} directories.`);
    - path: tools/kernel.config.ts
      content: |
        import { defineKernelConfig } from "@warpgogol/werkstatt/kernel/types";
        import { werkstattGodotPlugin } from "@warpgogol/werkstatt-godot";

        export default defineKernelConfig({
          name: "__PROJECT_NAME__",
          description: "__PROJECT_NAME__ workshop",
          moduleLoaders: {
            "forge-core": async () => (await import("@warpgogol/forge/os/core")).forgeCoreModule,
            "forge-rfc": async () => (await import("@warpgogol/forge/os/rfc-module")).forgeRfcModule,
            "forge-adr": async () => (await import("@warpgogol/forge/os/adr-module")).forgeAdrModule,
            "forge-plan": async () => (await import("@warpgogol/forge/os/plan-module")).forgePlanModule,
            "forge-audit": async () => (await import("@warpgogol/forge/os/audit-module")).forgeAuditModule,
            "forge-compass": async () => (await import("@warpgogol/forge/os/compass")).forgeCompassModule,
            "forge-naming": async () => (await import("@warpgogol/forge/os/naming-module")).forgeNamingModule,
            "forge-workflow": async () => (await import("@warpgogol/forge/os/workflow-module")).forgeWorkflowModule,
            "forge-session": async () => (await import("@warpgogol/forge/os/session-module")).forgeSessionModule,
            "forge-mission": async () => (await import("@warpgogol/forge/os/mission-module")).forgeMissionModule,
            "forge-spec": async () => (await import("@warpgogol/forge/os/spec-module")).forgeSpecModule,
            "forge-exploration": async () => (await import("@warpgogol/forge/os/exploration")).forgeExplorationModule,
            "forge-program": async () => (await import("@warpgogol/forge/os/program")).forgeProgramModule,
            "forge-werkstatt": async () => (await import("@warpgogol/forge/os/werkstatt")).forgeWerkstattModule,
            mission: async () => (await import("@warpgogol/werkstatt/mission-module")).createMissionModule(),
            sternsystem: async () => (await import("@warpgogol/werkstatt/sternsystem-module")).createSternsystemModule(),
            bordbuch: async () => (await import("@warpgogol/werkstatt/bordbuch-module")).createBordbuchModule(),
            "artifact-store": async () => (await import("@warpgogol/werkstatt/artifact-store-module")).createArtifactStoreModule(),
            release: async () => (await import("@warpgogol/werkstatt/release-module")).createReleaseModule(),
            leitstand: async () => (await import("@warpgogol/werkstatt/leitstand-module")).createLeitstandModule(),
            notausgang: async () => (await import("@warpgogol/werkstatt/notausgang-module")).createNotausgangModule(),
            evidence: async () => (await import("@warpgogol/werkstatt/evidence-module")).createEvidenceModule(),
            "werkstatt-plugin": async () => (await import("@warpgogol/werkstatt/os/werkstatt-plugin-module")).forgeWerkstattPluginModule,
            "werkstatt-autonomy": async () => (await import("@warpgogol/werkstatt/os/werkstatt-autonomy-module")).werkstattAutonomyModule,
            "__PROJECT_NAME__-plugin": async () => werkstattGodotPlugin,
          },
        });
    - path: .npmrc
      content: |
        # @warpgogol scoped registry — replace YOUR_NPM_TOKEN with a valid npm read token
        @warpgogol:registry=https://registry.npmjs.org/
        //registry.npmjs.org/:_authToken=YOUR_NPM_TOKEN
        # Auto-approve build scripts so operators aren't prompted during install
        dangerously-allow-all-builds=true
    - path: eslint.config.js
      content: |
        export default [
          {
            rules: {},
          },
        ];
    - path: .prettierrc.mjs
      content: |
        export default {
          semi: true,
          singleQuote: false,
          trailingComma: "all",
          printWidth: 100,
          tabWidth: 2,
        };
    - path: .gitattributes
      content: |
        # No LFS patterns for this stack
    - path: hooks/pre-commit
      content: |
        #!/bin/sh
        # Platform-scope pre-commit guard
        # Runs werkstatt autonomy and plugin validation before commits
        echo "Pre-commit: running platform checks..."
        pnpm exec werkstatt run werkstatt.autonomy.validate || exit 1
        pnpm exec werkstatt run werkstatt.plugin.validate || exit 1
    - path: systems-cache/.gitkeep
      content: |
        # Sternsystem cache directory (RFC-0790)
        # Per-system config and state files live in systems-cache/<id>/
    - path: missions/.gitkeep
      content: ""
    - path: .forge/pinned.yaml
      content: |
        # Pinned foundation files (DNA-62, RFC-0733)
        # Protect mode: warns on delete/move. Freeze mode: blocks modify too.
        entries:
          - path: tools/kernel.config.ts
            mode: protect
          - path: forge.yaml
            mode: protect
          - path: pnpm-workspace.yaml
            mode: protect
          - path: turbo.json
            mode: protect
          - path: tsconfig.base.json
            mode: protect
          - path: systems-cache/.gitkeep
            mode: protect
          - path: godot.version
            mode: protect
    - path: README.md
      content: |
        # __PROJECT_NAME__

        A Warpgogol workshop powered by the Werkstatt engine and the @warpgogol/werkstatt-godot plugin.

        ## Prerequisites

        - Node.js 24+
        - pnpm 10+
        - .NET SDK 8+
        - Godot 4.x (with .NET support)
        - On Windows: Git Bash or WSL (for shell scripts)

        ## Setup

        ### 1. Configure npm token

        This workshop depends on private @warpgogol packages. Edit `.npmrc` and replace `YOUR_NPM_TOKEN` with a valid npm read token:

        ```sh
        sed -i 's/YOUR_NPM_TOKEN/your_actual_token/' .npmrc
        ```

        ### 2. Install dependencies

        ```sh
        pnpm install
        ```

        ### 3. Verify the workshop

        ```sh
        pnpm exec werkstatt run forge.doctor
        pnpm exec werkstatt run werkstatt.plugin.validate
        pnpm exec werkstatt run werkstatt.autonomy.validate
        ```

        ## Running the game

        ### Quick start

        ```sh
        # Install the correct Godot version (mono build)
        ./scripts/install-godot.sh

        # Build and run the game
        ./scripts/run.sh
        ```

        Or open in the editor:

        ```sh
        ./scripts/run.sh --editor
        ```

        You should see "Hello, my-game!" in the game window.

        ### Manual setup (if you already have Godot installed)

        Ensure you have Godot 4.3 (mono) installed and on your PATH, then:

        ```sh
        cd apps/my-game
        dotnet build
        godot --path .
        ```

        ## Stack

        - Engine: @warpgogol/werkstatt
        - Plugin: @warpgogol/werkstatt-godot
        - Stack profile: godot-csharp
install:
  - pnpm install
firstWorkspace:
  path: apps/my-game
  files:
    - path: package.json
      content: |
        {
          "name": "my-game",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "scripts": {
            "build:check": "pnpm exec tsc -p tsconfig.json --noEmit || true",
            "test": "vitest run --passWithNoTests"
          }
        }
    - path: tsconfig.json
      content: |
        {
          "extends": "../tsconfig.base.json",
          "compilerOptions": {
            "outDir": "./dist"
          }
        }
    - path: project.godot
      content: |
        ; Engine configuration file.
        ; It's best edited using the editor UI and not directly,
        ; since the parameters that go here are not all obvious.
        config_version=5

        [application]
        config/name="my-game"
        run/main_scene="res://Scenes/Main.tscn"
        config/features=PackedStringArray("4.3", "C#", "Forward Plus")
        config/icon="res://icon.svg"

        [dotnet]
        project/assembly_name="my-game"
    - path: Game.csproj
      content: |
        <Project Sdk="Godot.NET.Sdk/4.3.0">
          <PropertyGroup>
            <AssemblyName>my-game</AssemblyName>
          </PropertyGroup>
        </Project>
    - path: Directory.Build.props
      content: |
        <Project>
          <PropertyGroup>
            <TargetFramework>net8.0</TargetFramework>
            <TargetFramework Condition="'$(OS)' == 'Windows_NT'">net8.0-windows</TargetFramework>
            <EnableDynamicLoading>true</EnableDynamicLoading>
            <LangVersion>latest</LangVersion>
            <Nullable>enable</Nullable>
          </PropertyGroup>
        </Project>
    - path: global.json
      content: |
        {
          "sdk": {
            "version": "8.0.100",
            "rollForward": "latestFeature"
          }
        }
    - path: Game.sln
      content: |
        Microsoft Visual Studio Solution File, Format Version 12.00
        # Visual Studio Version 17
        Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "my-game", "Game.csproj", "{AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}"
        EndProject
        Global
        	GlobalSection(SolutionConfigurationPlatforms) = preSolution
        		Debug|Any CPU = Debug|Any CPU
        		Release|Any CPU = Release|Any CPU
        	EndGlobalSection
        	GlobalSection(ProjectConfigurationPlatforms) = postSolution
        		{AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
        		{AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}.Debug|Any CPU.Build.0 = Debug|Any CPU
        		{AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}.Release|Any CPU.ActiveCfg = Release|Any CPU
        		{AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA}.Release|Any CPU.Build.0 = Release|Any CPU
        	EndGlobalSection
        EndGlobal
    - path: export_presets.cfg
      content: |
        [preset.0]

        name="Web"
        platform="Web"
        runnable=true
        dedicated_server=false
        custom_features=""
        export_filter="all_resources"
        include_filter=""
        exclude_filter=""
        export_path="bin/web/index.html"
        encryption_include_filters=""
        encryption_exclude_filters=""
        encrypt_export=false

        [preset.0.options]

        html/export_icon=true
        html/custom_html_shell=""
        html/head_include=""
    - path: omnisharp.json
      content: |
        {
          "FormattingOptions": {
            "UseTabs": true,
            "TabSize": 4,
            "IndentationSize": 4,
            "NewLine": "\n"
          },
          "RoslynExtensionsOptions": {
            "EnableAnalyzersSupport": true
          }
        }
    - path: .vscode/settings.json
      content: |
        {
          "files.associations": {
            "*.tscn": "gdscript",
            "*.tres": "gdscript",
            "*.gd": "gdscript"
          },
          "search.exclude": {
            "**/.godot": true,
            "**/bin": true,
            "**/obj": true
          },
          "files.watcherExclude": {
            "**/.godot/**": true,
            "**/bin/**": true,
            "**/obj/**": true
          }
        }
    - path: Scenes/Main.tscn
      content: |
        [gd_scene load_steps=2 format=3 uid="uid://main_scene"]

        [ext_resource type="Script" path="res://Scripts/Main.cs" id="1_script"]

        [node name="Main" type="Node2D"]
        script = ExtResource("1_script")

        [node name="HelloLabel" type="Label" parent="."]
        offset_left = 200.0
        offset_top = 200.0
        offset_right = 600.0
        offset_bottom = 300.0
        text = "Hello, my-game!"
    - path: Scripts/Main.cs
      content: |
        using Godot;

        public partial class Main : Node2D
        {
            public override void _Ready()
            {
                GD.Print("my-game ready");
            }
        }
    - path: .gitignore
      content: |
        .godot/
        bin/
        obj/
        *.user
        *.csproj.user
    - path: icon.svg
      content: |
        <svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <rect width="128" height="128" rx="16" fill="#478cbf"/>
          <text x="64" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">G</text>
        </svg>
    - path: .editorconfig
      content: |
        root = true

        [*]
        charset = utf-8
        end_of_line = lf
        insert_final_newline = true
        trim_trailing_whitespace = true

        [*.{cs,csproj}]
        indent_style = tab
        indent_size = 4

        [*.{tscn,tres,godot,cfg}]
        indent_style = tab
        indent_size = 4

        [*.{md,txt}]
        trim_trailing_whitespace = false
  install:
    - dotnet restore
