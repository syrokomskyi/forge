schema: forge/stack-profile@1
id: godot-csharp
displayName: Godot 4.x + C#
detect:
  anyOf:
    - project.godot
domain: game
register: creative
compass:
  fileExtensions:
    - .cs
    - .tscn
    - .tres
    - .gd
    - .ts
    - .tsx
    - .js
    - .mjs
terminology:
  artifact: game
  artifactPlural: games
  module: scene
  source: scene/script file
  output: build
  verify: headless-check
  operator: game-developer
devServer:
  command: godot --path . --editor
  port: 6005
rootAgentsMdTemplate: root-agents-godot.md
artifacts:
  - id: game
    extensions:
      - .tscn
      - .cs
      - .tres
    produce:
      command: dotnet build
      output: bin/Debug
    validate:
      command: godot --path . --headless --quit
    determinism:
      hashable: true
      inputs:
        - Scenes/**/*.tscn
        - Scripts/**/*.cs
        - Resources/**/*.tres
        - project.godot
assets:
  dir: Assets
  types:
    - id: image
      extensions: [.png, .jpg, .jpeg, .webp, .svg, .tscn]
      referencePattern: '"([^"]+\.(?:png|jpe?g|webp|svg))"'
    - id: audio
      extensions: [.wav, .mp3, .ogg]
      referencePattern: '"([^"]+\.(?:wav|mp3|ogg))"'
    - id: font
      extensions: [.ttf, .otf, .woff, .woff2]
      referencePattern: '"([^"]+\.(?:ttf|otf|woff2?))"'
release:
  target: local
  outputDir: build
  manifestName: build-manifest.json
prerequisites:
  - id: nodejs
    name: Node.js 24+
    check: node --version
    installHint: "https://nodejs.org/en/download/"
    severity: error
  - id: dotnet
    name: .NET SDK 10+
    check: dotnet --version
    installHint: "https://dotnet.microsoft.com/download"
    severity: error
  - id: godot
    name: Godot 4.x (with .NET support)
    check: godot --version
    installHint: "https://godotengine.org/download"
    severity: error
workspaceTypes:
  - id: game
    detect:
      glob: project.godot
    skills:
      - godot-feature
      - godot-scene-review
      - godot-debug
invariants:
  - id: GODOT-01
    rule: Scene files (.tscn) must reside in Scenes/ and scripts (.cs) in Scripts/
    severity: error
    check:
      kind: filename-pattern
      glob: "**/*.tscn"
      pattern: ^Scenes/
  - id: GODOT-02
    rule: The .godot/ directory must not be committed to git
    severity: error
    check:
      kind: gitignore-entry
      pattern: .godot/
  - id: GODOT-03
    rule: No hardcoded API keys or secrets in C# source files
    severity: error
    check:
      kind: secret-scan
      glob: "**/*.cs"
  - id: GODOT-04
    rule: project.godot autoloads and input map changes require explicit confirmation
    severity: warning
    check:
      kind: file-contains
      glob: project.godot
      pattern: ""
workspace:
  dirs:
    - apps
    - packages
    - services
    - scripts
    - tools
    - missions
    - systems-cache
  files:
    - path: pnpm-workspace.yaml
      content: |
        packages:
          - "apps/*"
          - "packages/*"
          - "services/*"
    - path: turbo.json
      content: |
        {
          "$schema": "https://turbo.build/schema.json",
          "tasks": {
            "build": {
              "dependsOn": ["^build"],
              "outputs": ["dist/**", "bin/**", ".godot/**"]
            },
            "build:check": {
              "dependsOn": ["^build:check"]
            },
            "test": {
              "dependsOn": ["^build:check"]
            }
          }
        }
    - path: tsconfig.base.json
      content: |
        {
          "compilerOptions": {
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "strict": true,
            "esModuleInterop": true,
            "skipLibCheck": true,
            "forceConsistentCasingInFileNames": true
          }
        }
    - path: .gitignore
      content: |
        node_modules
        dist
        .turbo
        .cache
        operator-profile.md

        # Godot
        .godot/
        .godot-bin/
        bin/
        obj/
        *.user
        *.csproj.user
    - path: .vscode/extensions.json
      content: |
        {
          "recommendations": [
            "ms-dotnettools.csharp",
            "muhammad-sammy.csharp",
            "geequla.godot-tools",
            "github.vscode-github-actions",
            "esbenp.prettier-vscode",
            "mechatroner.rainbow-csv"
          ]
        }
    - path: .vscode/tasks.json
      content: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "build",
              "command": "dotnet",
              "type": "process",
              "args": ["build", "${workspaceFolder}/apps/__PROJECT_NAME__/Game.csproj"],
              "problemMatcher": "$mscompile",
              "group": { "kind": "build", "isDefault": true }
            }
          ]
        }
    - path: .vscode/launch.json
      content: |
        {
          "version": "0.2.0",
          "configurations": [
            {
              "name": "Play (Node)",
              "type": "node",
              "request": "launch",
              "preLaunchTask": "build",
              "runtimeExecutable": "node",
              "runtimeArgs": ["${workspaceFolder}/scripts/run-godot.mjs"],
              "cwd": "${workspaceFolder}",
              "console": "integratedTerminal"
            },
            {
              "name": "Play (C# Dev Kit)",
              "type": "coreclr",
              "request": "launch",
              "preLaunchTask": "build",
              "program": "${workspaceFolder}/.godot-bin/godot",
              "args": ["--path", "${workspaceFolder}/apps/__PROJECT_NAME__"],
              "cwd": "${workspaceFolder}",
              "console": "internalConsole",
              "stopAtEntry": false
            },
            {
              "name": "Play (C# Dev Kit, PATH Godot)",
              "type": "coreclr",
              "request": "launch",
              "preLaunchTask": "build",
              "program": "godot",
              "args": ["--path", "${workspaceFolder}/apps/__PROJECT_NAME__"],
              "cwd": "${workspaceFolder}",
              "console": "internalConsole",
              "stopAtEntry": false
            }
          ]
        }
    - path: .github/workflows/ci.yml
      content: |
        name: CI

        on:
          pull_request:
          push:
            branches: [main]
          workflow_dispatch:

        concurrency:
          group: ${{ github.workflow }}-${{ github.ref }}
          cancel-in-progress: ${{ github.event_name == 'pull_request' }}

        permissions:
          contents: read

        jobs:
          ci:
            runs-on: ubuntu-latest
            timeout-minutes: 20
            name: Build, test, headless check
            env:
              TZ: UTC

            steps:
              - name: Checkout
                uses: actions/checkout@v5

              - name: Enable Corepack
                run: corepack enable

              - name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                  node-version: "24"
                  cache: "pnpm"

              - name: Setup .NET SDK
                uses: actions/setup-dotnet@v4
                with:
                  dotnet-version: "10.0.x"

              - name: Setup Godot
                uses: lihop/setup-godot@v1
                with:
                  version: "4.7"
                  mono: true

              - name: Install dependencies
                run: pnpm install --frozen-lockfile

              - name: Format check
                run: pnpm format:check

              - name: Type check
                run: pnpm build:check

              - name: Build
                run: pnpm build

              - name: Test
                run: pnpm test

              - name: Compass header validation
                run: pnpm exec werkstatt run compass.validate

        # Windows CI (optional — uncomment if Windows checks are needed):
        #
        #   windows-ci:
        #     runs-on: windows-latest
        #     name: Build, test, headless check (Windows)
        #     env:
        #       GIT_CONFIG_COUNT: 1
        #       GIT_CONFIG_KEY_0: core.longpaths
        #       GIT_CONFIG_VALUE_0: "true"
        #     steps:
        #       - name: Checkout
        #         uses: actions/checkout@v5
        #       - name: Enable Corepack
        #         run: corepack enable
        #       - name: Setup Node.js
        #         uses: actions/setup-node@v5
        #         with:
        #           node-version: "24"
        #           cache: "pnpm"
        #       - name: Setup .NET SDK
        #         uses: actions/setup-dotnet@v4
        #         with:
        #           dotnet-version: "10.0.x"
        #       - name: Setup Godot
        #         uses: lihop/setup-godot@v1
        #         with:
        #           version: "4.7"
        #           mono: true
        #       - name: Install dependencies
        #         run: pnpm install --frozen-lockfile
        #       - name: Format check
        #         run: pnpm format:check
        #       - name: Type check
        #         run: pnpm build:check
        #       - name: Build
        #         run: pnpm build
        #       - name: Test
        #         run: pnpm test
        #
        # The GIT_CONFIG_COUNT env block MUST be set before the checkout step
        # so git can handle long file paths during clone on Windows.
        # Do not add Windows to the matrix "just in case" — it requires
        # separate path-length and platform-specific dependency verification.
    - path: package.json
      content: |
        {
          "name": "__PROJECT_NAME__",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "engines": {
            "node": ">=24 <25"
          },
          "scripts": {
            "clean": "node scripts/clean.mjs",
            "format": "prettier --write .",
            "format:check": "prettier --check .",
            "build": "turbo run build",
            "build:check": "turbo run build:check",
            "test": "turbo run test",
            "upgrade-packages": "pnpm -r up"
          },
          "devDependencies": {
            "typescript": "^5.7.0",
            "turbo": "^2.3.0",
            "prettier": "^3.4.0",
            "@warpgogol/forge": "^2.2.0",
            "@warpgogol/werkstatt-engine": "^1.2.0",
            "@warpgogol/werkstatt-godot-game": "^0.6.0"
          }
        }
    - path: godot.version
      content: |
        # Exact Godot version for install-godot.sh and CI
        4.7.2
    - path: scripts/install-godot.sh
      content: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Download and install the Godot mono build specified in godot.version
        # Usage: ./scripts/install-godot.sh [--force]

        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        PROJECT_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"
        VERSION="$(grep -v '^#' "$PROJECT_ROOT/godot.version" | tr -d '[:space:]')"
        GODOT_DIR="$PROJECT_ROOT/.godot-bin"
        GODOT_BIN="$GODOT_DIR/godot"

        if [[ -x "$GODOT_BIN" ]] && [[ "$1" != "--force" ]]; then
          echo "Godot $VERSION already installed at $GODOT_BIN"
          echo "Use --force to reinstall."
          exit 0
        fi

        OS="$(uname -s)"
        ARCH="$(uname -m)"

        case "$OS" in
          Linux*)  PLATFORM="linux" ;;
          Darwin*) PLATFORM="osx"   ;;
          MINGW*|MSYS*|CYGWIN*) PLATFORM="win" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac

        case "$ARCH" in
          x86_64|amd64) ARCH_SUFFIX="x86_64" ;;
          arm64|aarch64) ARCH_SUFFIX="arm64" ;;
          *) echo "Unsupported arch: $ARCH"; exit 1 ;;
        esac

        if [[ "$PLATFORM" == "osx" && "$ARCH_SUFFIX" == "x86_64" ]]; then
          ARCH_SUFFIX="universal"
        fi

        if [[ "$PLATFORM" == "win" ]]; then
          ZIP_NAME="Godot_v${VERSION}-stable_mono_win64.zip"
        elif [[ "$PLATFORM" == "osx" ]]; then
          ZIP_NAME="Godot_v${VERSION}-stable_mono_${PLATFORM}_${ARCH_SUFFIX}.zip"
        else
          ZIP_NAME="Godot_v${VERSION}-stable_mono_${PLATFORM}_${ARCH_SUFFIX}.zip"
        fi

        URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/${ZIP_NAME}"

        echo "Downloading Godot $VERSION (mono) from:"
        echo "  $URL"

        mkdir -p "$GODOT_DIR"
        TMP_ZIP="$GODOT_DIR/$ZIP_NAME"

        if command -v curl &>/dev/null; then
          curl -fL --progress-bar -o "$TMP_ZIP" "$URL"
        elif command -v wget &>/dev/null; then
          wget -q --show-progress -O "$TMP_ZIP" "$URL"
        else
          echo "curl or wget required — please install one"; exit 1
        fi

        echo "Extracting..."
        if command -v unzip &>/dev/null; then
          unzip -o "$TMP_ZIP" -d "$GODOT_DIR"
        else
          echo "unzip not found — please install unzip"; exit 1
        fi
        rm -f "$TMP_ZIP"

        # Find the godot binary in the extracted files
        if [[ "$PLATFORM" == "osx" ]]; then
          # macOS: .app bundle
          APP_DIR="$GODOT_DIR/Godot.app"
          if [[ -d "$APP_DIR" ]]; then
            ln -sf "$APP_DIR/Contents/MacOS/Godot" "$GODOT_BIN"
          else
            # Some versions ship a unix executable
            find "$GODOT_DIR" -type f -name "Godot*" -executable | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
          fi
        elif [[ "$PLATFORM" == "win" ]]; then
          find "$GODOT_DIR" -type f -name "Godot*.exe" | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
        else
          find "$GODOT_DIR" -type f -name "Godot*" -executable | head -1 | xargs -I{} ln -sf {} "$GODOT_BIN"
        fi

        chmod +x "$GODOT_BIN" 2>/dev/null || true

        if [[ -x "$GODOT_BIN" || -L "$GODOT_BIN" ]]; then
          echo ""
          echo "Godot $VERSION installed to $GODOT_BIN"
          echo "Add to PATH: export PATH=\"$GODOT_DIR:$PATH\""
        else
          echo "Installation completed but binary not found. Check $GODOT_DIR"
          exit 1
        fi
    - path: scripts/run-godot.mjs
      content: |
        #!/usr/bin/env node
        // Launch Godot from any IDE — works in Windsurf, Cursor, VS Code without extensions.
        // Usage: node scripts/run-godot.mjs [--editor]

        import { existsSync, readdirSync, statSync } from "node:fs";
        import { join, dirname, resolve } from "node:path";
        import { spawnSync } from "node:child_process";
        import { fileURLToPath } from "node:url";

        const projectRoot = resolve(dirname(fileURLToPath(import.meta.url)), "..");
        const args = process.argv.slice(2);
        const editor = args.includes("--editor");

        // Find the game workspace (first directory under apps/ with a project.godot)
        let gameDir = null;
        const appsDir = join(projectRoot, "apps");
        if (existsSync(appsDir)) {
          for (const entry of readdirSync(appsDir)) {
            const dir = join(appsDir, entry);
            if (statSync(dir).isDirectory() && existsSync(join(dir, "project.godot"))) {
              gameDir = dir;
              break;
            }
          }
        }
        if (!gameDir) {
          console.error("No Godot project found under apps/*/");
          process.exit(1);
        }
        console.log(`Game project: ${gameDir}`);

        // Build C# project
        console.log("Building C# project...");
        const buildResult = spawnSync("dotnet", ["build"], { cwd: gameDir, stdio: "inherit" });
        if (buildResult.status !== 0) {
          console.error("dotnet build failed");
          process.exit(buildResult.status ?? 1);
        }

        // Find godot binary: prefer .godot-bin, then PATH
        const localGodot = join(projectRoot, ".godot-bin", "godot");
        const godotBin = existsSync(localGodot) ? localGodot : "godot";
        if (godotBin === "godot" && spawnSync("godot", ["--version"], { stdio: "ignore" }).status !== 0) {
          console.error("Godot not found. Run ./scripts/install-godot.sh first.");
          process.exit(1);
        }

        // Launch Godot
        console.log("Launching Godot...");
        const godotArgs = ["--path", gameDir];
        if (editor) godotArgs.push("--editor");
        const result = spawnSync(godotBin, godotArgs, { stdio: "inherit" });
        process.exit(result.status ?? 1);
    - path: scripts/run.sh
      content: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Build the C# project and launch Godot with the correct --path
        # Usage: ./scripts/run.sh [--editor]

        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        PROJECT_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"

        # Find the game workspace (first directory under apps/ with a project.godot)
        GAME_DIR=""
        for dir in "$PROJECT_ROOT"/apps/*/; do
          if [[ -f "${dir}project.godot" ]]; then
            GAME_DIR="${dir%/}"
            break
          fi
        done

        if [[ -z "$GAME_DIR" ]]; then
          echo "No Godot project found under apps/*/"; exit 1
        fi

        echo "Game project: $GAME_DIR"

        # Kill any running Godot instances (best-effort)
        pkill -f "godot.*--path" 2>/dev/null || true

        # Build C# project
        echo "Building C# project..."
        (cd "$GAME_DIR" && dotnet build)

        # Find godot binary: prefer .godot-bin, then PATH
        GODOT_BIN=""
        if [[ -x "$PROJECT_ROOT/.godot-bin/godot" ]]; then
          GODOT_BIN="$PROJECT_ROOT/.godot-bin/godot"
        elif command -v godot &>/dev/null; then
          GODOT_BIN="godot"
        else
          echo "Godot not found. Run ./scripts/install-godot.sh first."; exit 1
        fi

        echo "Launching Godot..."
        if [[ "$1" == "--editor" ]]; then
          exec "$GODOT_BIN" --path "$GAME_DIR" --editor
        else
          exec "$GODOT_BIN" --path "$GAME_DIR"
        fi
    - path: scripts/clean.mjs
      content: |
        import { readdir, rm } from "node:fs/promises";
        import { join } from "node:path";
        import { fileURLToPath } from "node:url";

        const TARGETS = new Set(["node_modules", ".turbo", "dist", ".godot", "bin", "obj", ".cache", ".wrangler"]);

        const repoRoot = join(fileURLToPath(import.meta.url), "..", "..");

        async function walk(dir, toDelete) {
          const entries = await readdir(dir, { withFileTypes: true });
          for (const entry of entries) {
            if (!entry.isDirectory()) continue;
            const name = entry.name;
            const fullPath = join(dir, name);
            if (TARGETS.has(name)) {
              toDelete.push(fullPath);
              continue;
            }
            await walk(fullPath, toDelete);
          }
        }

        const toDelete = [];
        await walk(repoRoot, toDelete);

        if (toDelete.length === 0) {
          console.log("Nothing to clean.");
          process.exit(0);
        }

        await Promise.all(toDelete.map((p) => rm(p, { recursive: true, force: true })));

        for (const p of toDelete) {
          console.log("deleted", p.replace(repoRoot + "/", ""));
        }

        console.log(`Cleaned ${toDelete.length} directories.`);
    - path: tools/kernel.config.ts
      content: |
        import { defineKernelConfig } from "@warpgogol/werkstatt-engine/kernel/types";
        import { werkstattGodotPlugin } from "@warpgogol/werkstatt-godot-game";

        export default defineKernelConfig({
          name: "__PROJECT_NAME__",
          description: "__PROJECT_NAME__ workshop",
          moduleLoaders: {
            "forge-core": async () => (await import("@warpgogol/forge/os/core")).forgeCoreModule,
            "forge-rfc": async () => (await import("@warpgogol/forge/os/rfc-module")).forgeRfcModule,
            "forge-adr": async () => (await import("@warpgogol/forge/os/adr-module")).forgeAdrModule,
            "forge-plan": async () => (await import("@warpgogol/forge/os/plan-module")).forgePlanModule,
            "forge-audit": async () => (await import("@warpgogol/forge/os/audit-module")).forgeAuditModule,
            "forge-compass": async () => (await import("@warpgogol/forge/os/compass")).forgeCompassModule,
            "forge-naming": async () => (await import("@warpgogol/forge/os/naming-module")).forgeNamingModule,
            "forge-workflow": async () => (await import("@warpgogol/forge/os/workflow-module")).forgeWorkflowModule,
            "forge-session": async () => (await import("@warpgogol/forge/os/session-module")).forgeSessionModule,
            "forge-mission": async () => (await import("@warpgogol/forge/os/mission-module")).forgeMissionModule,
            "forge-spec": async () => (await import("@warpgogol/forge/os/spec-module")).forgeSpecModule,
            "forge-exploration": async () => (await import("@warpgogol/forge/os/exploration")).forgeExplorationModule,
            "forge-program": async () => (await import("@warpgogol/forge/os/program")).forgeProgramModule,
            "forge-werkstatt": async () => (await import("@warpgogol/forge/os/werkstatt")).forgeWerkstattModule,
            mission: async () => (await import("@warpgogol/werkstatt-engine/mission-module")).createMissionModule(),
            sternsystem: async () => (await import("@warpgogol/werkstatt-engine/sternsystem-module")).createSternsystemModule(),
            bordbuch: async () => (await import("@warpgogol/werkstatt-engine/bordbuch-module")).createBordbuchModule(),
            "artifact-store": async () => (await import("@warpgogol/werkstatt-engine/artifact-store-module")).createArtifactStoreModule(),
            release: async () => (await import("@warpgogol/werkstatt-engine/release-module")).createReleaseModule(),
            leitstand: async () => (await import("@warpgogol/werkstatt-engine/leitstand-module")).createLeitstandModule(),
            notausgang: async () => (await import("@warpgogol/werkstatt-engine/notausgang-module")).createNotausgangModule(),
            evidence: async () => (await import("@warpgogol/werkstatt-engine/evidence-module")).createEvidenceModule(),
            "werkstatt-plugin": async () => (await import("@warpgogol/werkstatt-engine/os/werkstatt-plugin-module")).forgeWerkstattPluginModule,
            "werkstatt-autonomy": async () => (await import("@warpgogol/werkstatt-engine/os/werkstatt-autonomy-module")).werkstattAutonomyModule,
            "__PROJECT_NAME__-plugin": async () => werkstattGodotPlugin,
          },
        });
    - path: .npmrc
      content: |
        # @warpgogol scoped registry — replace YOUR_NPM_TOKEN with a valid npm read token
        @warpgogol:registry=https://registry.npmjs.org/
        //registry.npmjs.org/:_authToken=YOUR_NPM_TOKEN
        # Auto-approve build scripts so operators aren't prompted during install
        dangerously-allow-all-builds=true
    - path: eslint.config.js
      content: |
        export default [
          {
            rules: {},
          },
        ];
    - path: .prettierrc.mjs
      content: |
        export default {
          semi: true,
          singleQuote: false,
          trailingComma: "all",
          printWidth: 100,
          tabWidth: 2,
        };
    - path: .gitattributes
      content: |
        # No LFS patterns for this stack
    - path: hooks/pre-commit
      content: |
        #!/bin/sh
        # Platform-scope pre-commit guard
        # Runs werkstatt autonomy and plugin validation before commits
        # Note: compass.validate reads all source files and may add a few seconds
        # to commit time for large projects. Remove the line below if this is
        # too slow during iterative development.
        echo "Pre-commit: running platform checks..."
        pnpm exec werkstatt run werkstatt.autonomy.validate || exit 1
        pnpm exec werkstatt run werkstatt.plugin.validate || exit 1
        pnpm exec werkstatt run compass.validate || exit 1
    - path: scripts/git-guard.sh
      content: |
        #!/bin/bash
        # git-guard.sh — shell function that intercepts destructive git commands.
        # Sourced by ~/.zshenv (via setup-git-guards.sh).
        # Guards (only active in repos containing scripts/git-guard.sh):
        #   git stash, git reset --hard, git checkout --, git checkout -f,
        #   git switch -f, git clean -f, git restore
        # Override: ALLOW_DESTRUCTIVE_GIT=1 git stash

        export FORGE_GIT_GUARD=1

        _git_guard_find_root() {
          local _repo_root _dir
          _repo_root="$(command git rev-parse --show-toplevel 2>/dev/null || echo "")"
          if [ -z "$_repo_root" ]; then echo ""; return; fi
          if [ -f "$_repo_root/scripts/git-guard.sh" ]; then echo "$_repo_root"; return; fi
          _dir="$(dirname "$_repo_root")"
          while [ -n "$_dir" ] && [ "$_dir" != "/" ]; do
            if [ -f "$_dir/scripts/git-guard.sh" ]; then echo "$_dir"; return; fi
            _dir="$(dirname "$_dir")"
          done
          echo ""
        }

        git() {
          local _guard_root
          _guard_root="$(_git_guard_find_root)"
          if [ -z "$_guard_root" ] || [ -n "${ALLOW_DESTRUCTIVE_GIT:-}" ]; then
            command git "$@"; return $?
          fi
          local _all_args=("$@") _i=0 _cmd="" _cmd_index=0
          while [ "$_i" -lt "${#_all_args[@]}" ]; do
            local _arg="${_all_args[$_i]}"
            case "$_arg" in
              -C|-c|--git-dir|--work-tree|--namespace) _i=$((_i + 2)); continue ;;
              -*) _i=$((_i + 1)); continue ;;
            esac
            _cmd="$_arg"; _cmd_index="$_i"; break
          done
          local _sub_args=() _j=$((_cmd_index + 1))
          while [ "$_j" -lt "${#_all_args[@]}" ]; do
            _sub_args+=("${_all_args[$_j]}"); _j=$((_j + 1))
          done
          case "$_cmd" in
            stash)
              echo "BLOCKED: git stash is disabled in agent sessions." >&2
              echo "Set ALLOW_DESTRUCTIVE_GIT=1 to override." >&2; return 1 ;;
            reset)
              for _arg in "${_sub_args[@]}"; do
                if [ "$_arg" = "--hard" ] || [[ "$_arg" == --hard=* ]]; then
                  echo "BLOCKED: git reset --hard is disabled." >&2; return 1
                fi
              done; command git "$@"; return $? ;;
            checkout)
              for _arg in "${_sub_args[@]}"; do
                if [ "$_arg" = "--" ]; then
                  echo "BLOCKED: git checkout -- is disabled." >&2; return 1
                fi
                case "$_arg" in -f*|--force*)
                  echo "BLOCKED: git checkout -f is disabled." >&2; return 1 ;;
                esac
              done; command git "$@"; return $? ;;
            switch)
              for _arg in "${_sub_args[@]}"; do
                case "$_arg" in -f*|--force*)
                  echo "BLOCKED: git switch -f is disabled." >&2; return 1 ;;
                esac
              done; command git "$@"; return $? ;;
            restore)
              echo "BLOCKED: git restore is disabled." >&2; return 1 ;;
            clean)
              for _arg in "${_sub_args[@]}"; do
                case "$_arg" in -f*|--force*)
                  echo "BLOCKED: git clean -f is disabled." >&2; return 1 ;;
                esac
              done; command git "$@"; return $? ;;
            *) command git "$@"; return $? ;;
          esac
        }
    - path: scripts/setup-git-guards.sh
      content: |
        #!/bin/bash
        # setup-git-guards.sh — install shell function guards for destructive git ops.
        # Auto-detects shell: zsh → ~/.zshenv, bash → ~/.bashrc (Git Bash on Windows).
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel 2>/dev/null || echo "")"
        if [ -z "$repo_root" ]; then echo "ERROR: not inside a git repository" >&2; exit 1; fi
        guard_script="$repo_root/scripts/git-guard.sh"
        marker="# forge-git-guard"
        # Auto-detect target profile file based on current shell
        case "${SHELL:-}" in
          *zsh*) profile_file="${HOME}/.zshenv" ;;
          *bash*) profile_file="${HOME}/.bashrc" ;;
          *) profile_file="${HOME}/.bashrc" ;;
        esac
        mode="${1:-install}"
        case "$mode" in
          install)
            if [ ! -f "$guard_script" ]; then echo "ERROR: $guard_script not found" >&2; exit 1; fi
            chmod +x "$guard_script" 2>/dev/null || true
            if [ -f "$profile_file" ]; then
              tmp="$(mktemp)"
              awk -v marker="$marker" '$0 == marker { skip=2; next } skip > 0 { skip--; next } { print }' "$profile_file" > "$tmp" || true
              mv "$tmp" "$profile_file" 2>/dev/null || true
            fi
            echo "" >> "$profile_file"
            echo "$marker" >> "$profile_file"
            echo "[ -f \"$guard_script\" ] && source \"$guard_script\"" >> "$profile_file"
            echo "Git guards installed into $profile_file. Restart your shell or run: source $guard_script" ;;
          --verify)
            if [ -z "${FORGE_GIT_GUARD:-}" ]; then echo "MISSING: git guard not loaded" >&2; exit 1; fi
            if ! grep -qF "$marker" "$profile_file" 2>/dev/null; then echo "MISSING: guard not in $profile_file" >&2; exit 1; fi
            echo "OK: git guards installed and loaded" ;;
          --remove)
            if [ -f "$profile_file" ]; then
              tmp="$(mktemp)"
              awk -v marker="$marker" '$0 == marker { skip=2; next } skip > 0 { skip--; next } { print }' "$profile_file" > "$tmp" || true
              mv "$tmp" "$profile_file" 2>/dev/null || true
            fi
            echo "Git guards removed from $profile_file" ;;
          *) echo "Usage: bash scripts/setup-git-guards.sh [install|--verify|--remove]" >&2; exit 1 ;;
        esac
    - path: scripts/clean-stale-stashes.sh
      content: |
        #!/bin/bash
        # clean-stale-stashes.sh — detect and optionally drop stale git stash entries.
        # Usage: bash scripts/clean-stale-stashes.sh [--drop|--drop-all]
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel 2>/dev/null || echo "")"
        if [ -z "$repo_root" ]; then echo "ERROR: not inside a git repository" >&2; exit 1; fi
        mode="report"
        if [ "${1:-}" = "--drop" ]; then mode="drop"; elif [ "${1:-}" = "--drop-all" ]; then mode="drop-all"; fi
        stash_count="$(git -C "$repo_root" stash list 2>/dev/null | wc -l)"
        if [ "$stash_count" -eq 0 ]; then exit 0; fi
        stale_indices=() total="$stash_count"
        for ((i = 0; i < total; i++)); do
          ref="stash@{$i}"
          if [ "$mode" = "drop-all" ]; then stale_indices+=("$i"); continue; fi
          tracked_changes="$(git -C "$repo_root" stash show "$ref" --stat 2>/dev/null || true)"
          untracked_files="$(git -C "$repo_root" stash show --include-untracked "$ref" --stat 2>/dev/null || true)"
          if [ -z "$tracked_changes" ] && [ -z "$untracked_files" ]; then stale_indices+=("$i"); continue; fi
          if [ -z "$tracked_changes" ] && [ -n "$untracked_files" ]; then
            all_committed=true
            while IFS= read -r filepath; do
              [ -z "$filepath" ] && continue
              if ! git -C "$repo_root" cat-file -e "HEAD:$filepath" 2>/dev/null; then all_committed=false; break; fi
            done < <(git -C "$repo_root" stash show --include-untracked "$ref" --name-only 2>/dev/null || true)
            if [ "$all_committed" = true ]; then stale_indices+=("$i"); fi
          fi
        done
        if [ ${#stale_indices[@]} -eq 0 ]; then exit 0; fi
        if [ "$mode" = "report" ]; then
          echo "STALE STASH ENTRIES DETECTED (${#stale_indices[@]} of $stash_count):"
          for idx in "${stale_indices[@]}"; do
            echo "  stash@{$idx}: $(git -C "$repo_root" stash list | sed -n "$((idx + 1))p")"
          done
          echo "Clean with: bash scripts/clean-stale-stashes.sh --drop"; exit 1
        fi
        if [ "$mode" = "drop-all" ]; then git -C "$repo_root" stash clear; echo "Dropped all $stash_count entries."; exit 0; fi
        for ((i = ${#stale_indices[@]} - 1; i >= 0; i--)); do
          idx="${stale_indices[$i]}"
          git -C "$repo_root" stash drop "stash@{$idx}" 2>/dev/null || true
        done
        echo "Dropped ${#stale_indices[@]} stale entry/entries."; exit 0
    - path: scripts/check-clean-trees.sh
      content: |
        #!/bin/bash
        # check-clean-trees.sh — verify all git trees are clean.
        # Checks repo root + all nested .git directories up to 3 levels deep.
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel 2>/dev/null || echo "")"
        if [ -z "$repo_root" ]; then echo "ERROR: not inside a git repository" >&2; exit 1; fi
        dirty=0 output=""
        main_status="$(git -C "$repo_root" status --short 2>/dev/null || true)"
        if [ -n "$main_status" ]; then
          output+="DIRTY: $repo_root\n$(printf '%s\n' "$main_status" | sed 's/^/  /')\n"
          dirty=1
        fi
        while IFS= read -r gitdir; do
          nested_root="$(dirname "$gitdir")"
          [ "$nested_root" = "$repo_root" ] && continue
          nested_status="$(git -C "$nested_root" status --short 2>/dev/null || true)"
          if [ -n "$nested_status" ]; then
            output+="DIRTY: $nested_root\n$(printf '%s\n' "$nested_status" | sed 's/^/  /')\n"
            dirty=1
          fi
        done < <(find "$repo_root" -maxdepth 3 -name ".git" -type d 2>/dev/null | head -20)
        if [ "$dirty" -eq 1 ]; then
          echo -e "$output" | head -40
          echo "---"
          echo "Uncommitted changes detected. Commit before session end."
          exit 1
        fi
        exit 0
    - path: hooks/pre-user-prompt.sh
      content: |
        #!/bin/bash
        # Pre-user-prompt hook: session-end protocol + stale-stash + git-guard checks.
        # Requires jq for JSON payload parsing.
        set -euo pipefail
        payload="$(cat)"
        user_prompt="$(printf '%s' "$payload" | jq -r '.tool_info.user_prompt // empty' 2>/dev/null || true)"
        if [ -z "$user_prompt" ]; then exit 0; fi
        repo_root="$(git rev-parse --show-toplevel 2>/dev/null || echo "")"
        if [ -n "$repo_root" ] && [ -x "$repo_root/scripts/clean-stale-stashes.sh" ]; then
          stash_output="$("$repo_root/scripts/clean-stale-stashes.sh" 2>&1 || true)"
          if [ -n "$stash_output" ]; then
            echo "⚠️  STALE GIT STASH DETECTED" >&2
            echo "$stash_output" >&2
            echo "Clean with: bash scripts/clean-stale-stashes.sh --drop" >&2
            echo "" >&2
          fi
        fi
        if [ -n "$repo_root" ] && [ -f "$repo_root/scripts/git-guard.sh" ]; then
          if [ -z "${FORGE_GIT_GUARD:-}" ]; then
            echo "⚠️  GIT GUARD NOT LOADED — destructive git operations are NOT blocked." >&2
            echo "Run: source $repo_root/scripts/git-guard.sh" >&2
            echo "" >&2
          fi
        fi
        session_end_phrases=("Завершаем эту сессию" "Завершаем сессию" "Заканчиваем сессию" "Завершить сессию" "End session" "Wrap up" "Session end" "/session-end")
        matched=""
        for phrase in "${session_end_phrases[@]}"; do
          if printf '%s' "$user_prompt" | grep -qiF "$phrase"; then matched="$phrase"; break; fi
        done
        if [ -z "$matched" ]; then exit 0; fi
        cat >&2 <<EOF
        SESSION-END PROTOCOL TRIGGERED (matched: "$matched")
        The user's original message was:
          > $user_prompt
        You MUST invoke the fo-session-retro skill via the skill tool BEFORE producing
        any other output. This is a NON-NEGOTIABLE BLOCKED GATE per PREFERENCES.md.
        DO NOT produce a closing summary or ad-hoc output. The closing block must come
        from fo-session-retro's report.
        Protocol steps:
        1. Verify clean working trees — run: bash scripts/check-clean-trees.sh
        2. Invoke fo-session-retro via the skill tool
        3. The retro skill's report IS the session-end output
        EOF
        if [ -n "$repo_root" ] && [ -x "$repo_root/scripts/check-clean-trees.sh" ]; then
          tree_output="$("$repo_root/scripts/check-clean-trees.sh" 2>&1 || true)"
          if [ -n "$tree_output" ]; then echo "" >&2; echo "$tree_output" >&2; fi
        fi
        exit 2
    - path: hooks/pre-user-prompt-wrapper.mjs
      content: |
        #!/usr/bin/env node
        // pre-user-prompt-wrapper.mjs — cross-platform wrapper for pre-user-prompt.sh.
        // Detects bash availability, prints one-time warning if bash not found,
        // then delegates to bash hooks/pre-user-prompt.sh with stdin piped.
        import { execFileSync, spawn } from "node:child_process";
        import { existsSync, mkdirSync, writeFileSync } from "node:fs";
        import { dirname, join } from "node:path";
        import { fileURLToPath } from "node:url";

        const __dirname = dirname(fileURLToPath(import.meta.url));
        const scriptPath = join(__dirname, "pre-user-prompt.sh");
        const cacheDir = join(__dirname, "..", ".cache");
        const warningFlag = join(cacheDir, "git-guard-warning-sent");

        // If pre-user-prompt.sh doesn't exist, silently exit
        if (!existsSync(scriptPath)) {
          process.exit(0);
        }

        // Check if bash is available
        let bashAvailable = false;
        try {
          execFileSync("bash", ["--version"], { stdio: "ignore" });
          bashAvailable = true;
        } catch {
          bashAvailable = false;
        }

        if (!bashAvailable) {
          // Print one-time warning if not already sent
          if (!existsSync(warningFlag)) {
            console.error("⚠️  bash not found — pre-user-prompt hook is disabled.");
            console.error("Install Git Bash (Git for Windows) or WSL to enable agent-safety hooks.");
            console.error("");
            try {
              mkdirSync(cacheDir, { recursive: true });
              writeFileSync(warningFlag, new Date().toISOString(), "utf8");
            } catch {
              // Best-effort — don't crash if cache dir is not writable
            }
          }
          process.exit(0);
        }

        // Delegate to bash script with stdin piped
        const child = spawn("bash", [scriptPath], { stdio: ["inherit", "inherit", "inherit"] });
        child.on("exit", (code) => {
          process.exit(code ?? 0);
        });
    - path: .windsurf/hooks.json
      content: |
        {
          "hooks": {
