    - path: README.md
      content: |
        # __PROJECT_NAME__

        A Warpgogol workshop powered by the Werkstatt engine and the @warpgogol/werkstatt-godot-game plugin.

        ## Prerequisites

        - Node.js 24+
        - pnpm 10+
        - .NET SDK 10+
        - Godot 4.x (with .NET support)
        - On Windows: Git Bash or WSL (for shell scripts)
        - jq (for pre-user-prompt hook)

        ## Setup

        ### 1. Configure npm token

        This workshop depends on private @warpgogol packages. Edit `.npmrc` and replace `YOUR_NPM_TOKEN` with a valid npm read token:

        ```sh
        sed -i 's/YOUR_NPM_TOKEN/your_actual_token/' .npmrc
        ```

        ### 2. Install dependencies

        ```sh
        pnpm install
        ```

        ### 3. Install git guards (recommended)

        Git guards prevent AI agents from running destructive git commands (`git stash`, `git reset --hard`, `git checkout --`, `git restore`, `git clean -f`):

        ```sh
        bash scripts/setup-git-guards.sh
        ```

        This installs a shell function into your shell profile (`~/.zshenv` for zsh, `~/.bashrc` for bash/Git Bash). Restart your shell or run `source scripts/git-guard.sh`.

        > **Windows**: Git guards require Git Bash (included with Git for Windows). Run `bash scripts/setup-git-guards.sh` from Git Bash. If bash is not in PATH, the pre-user-prompt hook wrapper prints a one-time warning. Install `jq` via `winget install jqlang.jq` or `choco install jq`.

        ### 4. Verify the workshop

        ```sh
        pnpm exec werkstatt run forge.doctor
        pnpm exec werkstatt run werkstatt.plugin.validate
        pnpm exec werkstatt run werkstatt.autonomy.validate
        ```

        ## Running the game

        ### Quick start

        ```sh
        # Install the correct Godot version (mono build)
        ./scripts/install-godot.sh

        # Build and run the game
        ./scripts/run.sh
        ```

        Or open in the editor:

        ```sh
        ./scripts/run.sh --editor
        ```

        You should see "Hello, my-game!" in the game window.

        ### Manual setup (if you already have Godot installed)

        Ensure you have Godot 4.3 (mono) installed and on your PATH, then:

        ```sh
        cd apps/my-game
        dotnet build
        godot --path .
        ```

        ## Stack

        - Engine: @warpgogol/werkstatt-engine
        - Plugin: @warpgogol/werkstatt-godot-game
        - Stack profile: godot-csharp
