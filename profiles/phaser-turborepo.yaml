schema: forge/stack-profile@1
id: phaser-turborepo
displayName: Phaser + Turborepo
detect:
  anyOf:
    - phaser.config.*
    - package.json
workspace:
  dirs:
    - games
    - packages
    - services
  files:
    - path: pnpm-workspace.yaml
      content: |
        packages:
          - "games/*"
          - "packages/*"
          - "services/*"
    - path: turbo.json
      content: |
        {
          "$schema": "https://turbo.build/schema.json",
          "tasks": {
            "build": {
              "dependsOn": ["^build"],
              "outputs": ["dist/**"]
            },
            "build:check": {
              "dependsOn": ["^build:check"]
            },
            "test": {
              "dependsOn": ["^build:check"]
            }
          }
        }
    - path: tsconfig.base.json
      content: |
        {
          "compilerOptions": {
            "target": "ESNext",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "strict": true,
            "esModuleInterop": true,
            "skipLibCheck": true,
            "forceConsistentCasingInFileNames": true
          }
        }
    - path: .gitignore
      content: |
        node_modules
        dist
        .turbo
        .cache
        operator-profile.md
install:
  - pnpm add -D typescript turbo @webgogol/forge
firstWorkspace:
  path: games/my-game
  files:
    - path: package.json
      content: |
        {
          "name": "my-game",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "scripts": {
            "build:check": "pnpm exec tsc -p tsconfig.json --noEmit",
            "test": "vitest run --passWithNoTests"
          }
        }
    - path: tsconfig.json
      content: |
        {
          "extends": "../tsconfig.base.json",
          "compilerOptions": {
            "outDir": "./dist"
          }
        }
  install:
    - pnpm add phaser
    - pnpm add -D vitest
