schema: forge/stack-profile@1
# RFC-1639: the superfolder profile declares a forge CONTAINER — a non-git
# folder whose immediate children are member repositories carrying forge.yaml.
# Container state (frictions, sessions, memory) lives inside the container; the
# friction registry mints W-NNNN ids so container records can never collide
# with member-repo F-NNNN namespaces.
id: superfolder
displayName: Superfolder container
detect:
  anyOf:
    - superfolder.marker
workspace:
  dirs:
    - docs
    - docs/frictions
    - docs/sessions
    - .agents/memory
  files:
    - path: superfolder.marker
      content: |
        This directory is a forge container scope (profile: superfolder).
        Members are its immediate children carrying their own forge.yaml;
        `<member>@<branch>` worktree siblings are excluded automatically.
        Non-forge child dirs go in `members.exclude`; pinned members get
        `members.annotations.<id>.frozen: true` in forge.yaml.
    - path: .gitignore
      content: |
        node_modules
        .cache
        .agents/memory
        operator-profile.md
frictions:
  idPrefix: W
install: []
