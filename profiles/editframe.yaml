schema: forge/stack-profile@1
id: editframe
displayName: Editframe Video
detect:
  anyOf:
    - editframe.config.*
domain: video
register: creative
terminology:
  artifact: composition
  artifactPlural: compositions
  module: scene
  source: composition file
  output: render
  verify: render-verify
  operator: director
devServer:
  command: editframe preview
  port: 4321
artifacts:
  - id: composition
    extensions:
      - .tsx
      - .html
    produce:
      command: editframe render
      output: dist/{composition}.mp4
    validate:
      command: editframe check
    determinism:
      hashable: true
      inputs:
        - compositions/**/*.tsx
        - compositions/**/*.html
        - assets/**
assets:
  dir: assets
  types:
    - id: video
      extensions: [.mp4, .webm]
      referencePattern: 'src="([^"]+\.(?:mp4|webm))"'
    - id: audio
      extensions: [.mp3, .wav]
      referencePattern: 'src="([^"]+\.(?:mp3|wav))"'
    - id: image
      extensions: [.png, .jpg, .jpeg, .webp, .svg]
      referencePattern: 'src="([^"]+\.(?:png|jpe?g|webp|svg))"'
release:
  target: local
  outputDir: release
  manifestName: release-manifest.json
prerequisites:
  - id: nodejs
    name: Node.js 18+
    check: node --version
    installHint: "https://nodejs.org/en/download/"
    severity: error
  - id: ffmpeg
    name: FFmpeg
    check: ffmpeg -version
    installHint: "https://ffmpeg.org/download.html"
    severity: error
workspaceTypes:
  - id: composition
    detect:
      glob: "*.tsx"
      contains: TimelineRoot
      packageJsonDep: "@editframe/react"
    skills:
      - ef-onboard
      - ef-composition-review
      - ef-render-verify
    agentsMdTemplate: editframe-templates/composition-agents.md
  - id: html-composition
    detect:
      glob: "*.html"
      contains: ef-timegroup
      packageJsonDep: "@editframe/cli"
    skills:
      - ef-onboard
      - ef-composition-review
      - ef-render-verify
    agentsMdTemplate: editframe-templates/html-composition-agents.md
invariants:
  - id: VIDEO-01
    rule: Composition filenames must use kebab-case (lowercase letters, digits, hyphens only)
    severity: error
    check:
      kind: filename-pattern
      glob: "compositions/**/*.{tsx,html}"
      pattern: "^[a-z0-9-]+\\.(tsx|html)$"
  - id: VIDEO-02
    rule: Scene durations must use contain mode by default to avoid unexpected cropping
    severity: warning
    check:
      kind: file-contains
      glob: "compositions/**/*.{tsx,html}"
      pattern: contain
  - id: VIDEO-03
    rule: All speech audio elements must have corresponding Captions components for accessibility
    severity: error
    check:
      kind: file-contains
      glob: "compositions/**/*.{tsx,html}"
      pattern: Captions
  - id: VIDEO-04
    rule: Root Timegroup must declare duration or use mode="contain" or mode="fit"
    severity: error
    check:
      kind: file-contains
      glob: "compositions/**/*.{tsx,html}"
      pattern: 'Timegroup[^>]*(duration|mode="contain"|mode="fit")[^>]*>|ef-timegroup[^>]*(duration|mode="contain"|mode="fit")[^>]*>'
  - id: VIDEO-05
    rule: All duration values must be valid CSS time strings (e.g. 5s, 500ms, 2.5s)
    severity: error
    check:
      kind: attribute-pattern
      glob: "compositions/**/*.{tsx,html}"
      elements:
        - ef-timegroup
        - Timegroup
      attribute: "duration"
      pattern: "^\\d+(\\.\\d+)?(s|ms)$"
  - id: VIDEO-06
    rule: "mode attribute must be one of: sequence, fixed, contain, fit"
    severity: error
    check:
      kind: attribute-pattern
      glob: "compositions/**/*.{tsx,html}"
      elements:
        - ef-timegroup
        - Timegroup
      attribute: "mode"
      pattern: "^(sequence|fixed|contain|fit)$"
  - id: VIDEO-07
    rule: fps must be a positive integer (default 30)
    severity: warning
    check:
      kind: attribute-pattern
      glob: "compositions/**/*.{tsx,html}"
      elements:
        - ef-timegroup
        - Timegroup
      attribute: "fps"
      pattern: "^[1-9]\\d*$"
  - id: VIDEO-08
    rule: loop attribute should only be used on the root Timegroup (no effect on render for nested groups)
    severity: warning
    check:
      kind: file-not-contains
      glob: "compositions/**/*.{tsx,html}"
      negatedPattern: "<(Timegroup|ef-timegroup)[^>]*loop[^>]*>[\\s\\S]*<(Timegroup|ef-timegroup)[^>]*loop"
  - id: VIDEO-09
    rule: offset values must be valid CSS time strings (e.g. 0.5s, 3s, 500ms)
    severity: warning
    check:
      kind: attribute-pattern
      glob: "compositions/**/*.{tsx,html}"
      elements:
        - ef-timegroup
        - Timegroup
      attribute: "offset"
      pattern: "^\\d+(\\.\\d+)?(s|ms)$"
workspace:
  dirs:
    - compositions
    - packages
    - services
  files:
    - path: pnpm-workspace.yaml
      content: |
        packages:
          - "compositions/*"
          - "packages/*"
          - "services/*"
    - path: turbo.json
      content: |
        {
          "$schema": "https://turbo.build/schema.json",
          "tasks": {
            "build": {
              "dependsOn": ["^build"],
              "outputs": ["dist/**"]
            },
            "build:check": {
              "dependsOn": ["^build:check"]
            },
            "test": {
              "dependsOn": ["^build:check"]
            }
          }
        }
    - path: .gitignore
      content: |
        node_modules
        dist
        .turbo
        .cache
        operator-profile.md
    - path: .github/workflows/ci.yml
      content: |
        name: CI

        on:
          pull_request:
          push:
            branches: [main]
          workflow_dispatch:

        concurrency:
          group: ${{ github.workflow }}-${{ github.ref }}
          cancel-in-progress: ${{ github.event_name == 'pull_request' }}

        permissions:
          contents: read

        jobs:
          ci:
            runs-on: ubuntu-latest
            timeout-minutes: 15
            name: Lint, type-check, build, test
            env:
              TZ: UTC

            steps:
              - name: Checkout
                uses: actions/checkout@v5

              - name: Enable Corepack
                run: corepack enable

              - name: Setup Node.js
                uses: actions/setup-node@v5
                with:
                  node-version: "24"
                  cache: "pnpm"

              - name: Install dependencies
                run: pnpm install --frozen-lockfile

              - name: Format check
                run: pnpm format:check

              - name: Type check
                run: pnpm build:check

              - name: Build
                run: pnpm build

              - name: Test
                run: pnpm test

        # Windows CI (optional — uncomment if Windows checks are needed):
        #
        #   windows-ci:
        #     runs-on: windows-latest
        #     name: Lint, type-check, build, test (Windows)
        #     env:
        #       GIT_CONFIG_COUNT: 1
        #       GIT_CONFIG_KEY_0: core.longpaths
        #       GIT_CONFIG_VALUE_0: "true"
        #     steps:
        #       - name: Checkout
        #         uses: actions/checkout@v5
        #       - name: Enable Corepack
        #         run: corepack enable
        #       - name: Setup Node.js
        #         uses: actions/setup-node@v5
        #         with:
        #           node-version: "24"
        #           cache: "pnpm"
        #       - name: Install dependencies
        #         run: pnpm install --frozen-lockfile
        #       - name: Format check
        #         run: pnpm format:check
        #       - name: Type check
        #         run: pnpm build:check
        #       - name: Build
        #         run: pnpm build
        #       - name: Test
        #         run: pnpm test
        #
        # The GIT_CONFIG_COUNT env block MUST be set before the checkout step
        # so git can handle long file paths during clone on Windows.
        # Do not add Windows to the matrix "just in case" — it requires
        # separate path-length and platform-specific dependency verification.
    - path: package.json
      content: |
        {
          "name": "__PROJECT_NAME__",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "packageManager": "pnpm@11.10.0",
          "engines": {
            "node": ">=22"
          },
          "scripts": {
            "clean": "node scripts/clean.mjs",
            "format": "prettier --write .",
            "format:check": "prettier --check .",
            "build": "turbo run build",
            "build:check": "turbo run build:check",
            "test": "turbo run test",
            "upgrade-packages": "pnpm -r up"
          }
        }
    - path: .prettierrc.mjs
      content: |
        /** @type {import("prettier").Config} */
        export default {
          semi: true,
          singleQuote: false,
          trailingComma: "all",
          printWidth: 100,
          tabWidth: 2,
        };
    - path: scripts/clean.mjs
      content: |
        import { readdir, rm } from "node:fs/promises";
        import { join } from "node:path";
        import { fileURLToPath } from "node:url";

        const TARGETS = new Set(["node_modules", ".turbo", "dist", ".cache"]);

        const repoRoot = join(fileURLToPath(import.meta.url), "..", "..");

        async function walk(dir, toDelete) {
          const entries = await readdir(dir, { withFileTypes: true });
          for (const entry of entries) {
            if (!entry.isDirectory()) continue;
            const name = entry.name;
            const fullPath = join(dir, name);
            if (TARGETS.has(name)) {
              toDelete.push(fullPath);
              continue;
            }
            await walk(fullPath, toDelete);
          }
        }

        const toDelete = [];
        await walk(repoRoot, toDelete);

        if (toDelete.length === 0) {
          console.log("Nothing to clean.");
          process.exit(0);
        }

        await Promise.all(toDelete.map((p) => rm(p, { recursive: true, force: true })));

        for (const p of toDelete) {
          console.log("deleted", p.replace(repoRoot + "/", ""));
        }

        console.log(`Cleaned ${toDelete.length} directories.`);
install:
  - pnpm add -w -D @editframe/cli @warpgogol/forge turbo prettier
firstWorkspace:
  path: compositions/my-first-video
  files:
    - path: package.json
      content: |
        {
          "name": "my-first-video",
          "version": "0.1.0",
          "private": true,
          "type": "module",
          "scripts": {
            "preview": "editframe preview",
            "render": "editframe render -o dist/my-first-video.mp4",
            "check": "editframe check"
          }
        }
    - path: index.html
      content: |
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>my-first-video</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.tsx"></script>
          </body>
        </html>
    - path: src/main.tsx
      content: |
        import React from "react";
        import { createRoot } from "react-dom/client";
        import Composition from "../composition";

        const root = document.getElementById("root");
        if (!root) throw new Error("#root element not found");

        createRoot(root).render(
          <React.StrictMode>
            <Composition />
          </React.StrictMode>,
        );
    - path: vite.config.ts
      content: |
        import { defineConfig } from "vite";
        import react from "@vitejs/plugin-react";
        import editframePlugin from "@editframe/vite-plugin";

        export default defineConfig({
          plugins: [react(), editframePlugin()],
        });
    - path: tsconfig.json
      content: |
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "jsx": "react-jsx",
            "strict": true,
            "esModuleInterop": true,
            "skipLibCheck": true,
            "noEmit": true,
            "lib": ["ES2022", "DOM", "DOM.Iterable"]
          },
          "include": ["src", "composition.tsx", "vite.config.ts"]
        }
    - path: composition.tsx
      content: |
        /*
          Editframe React composition — my-first-video
          This file declares a video composition using @editframe/react components.
          Run `editframe preview` to preview, `editframe render` to produce output.
        */
        import { TimelineRoot, Timegroup, Text } from "@editframe/react";

        function Timeline({ id }: { id: string }) {
          return (
            <Timegroup id={id} duration="10s" mode="contain">
              <Text
                text="Hello, Editframe!"
                x="50%"
                y="50%"
                fontSize="48px"
                color="white"
                textAlign="center"
                duration="5s"
              />
            </Timegroup>
          );
        }

        export default function Composition() {
          return <TimelineRoot id="root" component={Timeline} />;
        }
  install:
    - pnpm add -D @editframe/react @editframe/vite-plugin @editframe/dev-server react react-dom typescript @types/react @types/react-dom vite @vitejs/plugin-react tailwindcss @tailwindcss/vite vitest
templates:
  - id: react
    default: true
    firstWorkspace:
      path: compositions/my-first-video
      files:
        - path: package.json
          content: |
            {
              "name": "my-first-video",
              "version": "0.1.0",
              "private": true,
              "type": "module",
              "scripts": {
                "preview": "editframe preview",
                "render": "editframe render -o dist/my-first-video.mp4",
